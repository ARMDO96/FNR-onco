<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121514" media="(prefers-color-scheme: dark)">
<meta name="description" content="Checklist de requisitos de las normativas FNR para cobertura de tratamiento sistémico en mama, colorrecto, próstata, pulmón y cuello uterino.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Checklist FNR Oncología</title>
<style>
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
:root{
  --bg:#F4F5F4; --surface:#FFFFFF; --sunk:#EAEDEB; --ink:#1A1F1D; --ink-2:#4B5551; --ink-3:#77817D;
  --line:#D8DDDA; --on-t:#FFFFFF;
  --exc:#A8341F; --exc-soft:#F7E2DC; --ind:#8A5F0E; --ind-soft:#F5EAD2; --ok-soft:#E3EEE8; --ok:#2E6A55;
  --c-mama:#B3305F; --c-mama-s:#F8E3EA;
  --c-ccr:#3B7A2A;  --c-ccr-s:#E3EFDD;
  --c-pros:#5A48A8; --c-pros-s:#E8E4F6;
  --c-pulm:#2A5FA5; --c-pulm-s:#E0E9F6;
  --c-ccu:#0B7A88;  --c-ccu-s:#DDF0F2;
  --t:var(--c-mama); --t-s:var(--c-mama-s);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121514; --surface:#1A1E1C; --sunk:#222826; --ink:#E6EAE8; --ink-2:#AFB8B4; --ink-3:#808A86;
    --line:#2F3633; --on-t:#121514;
    --exc:#F08C77; --exc-soft:#3A221D; --ind:#E2B563; --ind-soft:#3A2F17; --ok-soft:#1F332B; --ok:#86C9AE;
    --c-mama:#F08AAE; --c-mama-s:#3D2230; --c-ccr:#93CF7E; --c-ccr-s:#22331D; --c-pros:#B3A6F0; --c-pros-s:#2C2742;
    --c-pulm:#8DB5EE; --c-pulm-s:#1E2A3D; --c-ccu:#6FD0DC; --c-ccu-s:#173236;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121514; --surface:#1A1E1C; --sunk:#222826; --ink:#E6EAE8; --ink-2:#AFB8B4; --ink-3:#808A86;
  --line:#2F3633; --on-t:#121514;
  --exc:#F08C77; --exc-soft:#3A221D; --ind:#E2B563; --ind-soft:#3A2F17; --ok-soft:#1F332B; --ok:#86C9AE;
  --c-mama:#F08AAE; --c-mama-s:#3D2230; --c-ccr:#93CF7E; --c-ccr-s:#22331D; --c-pros:#B3A6F0; --c-pros-s:#2C2742;
  --c-pulm:#8DB5EE; --c-pulm-s:#1E2A3D; --c-ccu:#6FD0DC; --c-ccu-s:#173236;
}
.app[data-tumor="mama"]{--t:var(--c-mama);--t-s:var(--c-mama-s)}
.app[data-tumor="ccr"]{--t:var(--c-ccr);--t-s:var(--c-ccr-s)}
.app[data-tumor="pros"]{--t:var(--c-pros);--t-s:var(--c-pros-s)}
.app[data-tumor="pulm"]{--t:var(--c-pulm);--t-s:var(--c-pulm-s)}
.app[data-tumor="ccu"]{--t:var(--c-ccu);--t-s:var(--c-ccu-s)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:18px 48px}
.app{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top h1{font-family:var(--cond);font-weight:600;font-size:1.55rem;letter-spacing:-.01em;margin:0;text-wrap:balance}
header.top p{margin:2px 0 0;font-size:.82rem;color:var(--ink-3)}

/* tumor tabs */
.tumors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media(max-width:640px){.tumors{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tt{appearance:none;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 10px 8px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden;font:inherit;min-width:0}
.tt::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--tc)}
.tt b{font-family:var(--cond);font-weight:600;font-size:.98rem;line-height:1.15}
.tt small{font-size:.72rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt[aria-pressed="true"]{background:var(--tc);border-color:var(--tc);color:var(--on-t)}
.tt[aria-pressed="true"] small{color:var(--on-t);opacity:.85}
.tt:hover{border-color:var(--tc)}
.tt[data-t="mama"]{--tc:var(--c-mama)} .tt[data-t="ccr"]{--tc:var(--c-ccr)} .tt[data-t="pros"]{--tc:var(--c-pros)} .tt[data-t="pulm"]{--tc:var(--c-pulm)} .tt[data-t="ccu"]{--tc:var(--c-ccu)}

/* tumor band */
.band{border-left:5px solid var(--t);background:var(--t-s);border-radius:0 8px 8px 0;padding:10px 14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;align-items:baseline}
.band h2{margin:0;font-family:var(--cond);font-weight:600;font-size:1.2rem;color:var(--t)}
.band span{font-size:.8rem;color:var(--ink-2)}

.picker{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:760px){.picker{grid-template-columns:auto 1fr;align-items:start;column-gap:14px}}
.grp-label{font-family:var(--cond);font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);padding-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .88rem/1.2 var(--sans);padding:7px 11px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left}
.chip small{font-weight:400;font-size:.72rem;color:var(--ink-3)}
.chip:hover{border-color:var(--t)}
.chip[aria-pressed="true"]{background:var(--t);border-color:var(--t);color:var(--on-t)}
.chip[aria-pressed="true"] small{color:var(--on-t);opacity:.85}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-left:6px;vertical-align:1px}
button:focus-visible,input:focus-visible+.box{outline:2px solid var(--t);outline-offset:2px}

.ihead{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--t);border-radius:8px;padding:14px 18px;display:grid;gap:12px}
.ihead-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.ihead h3{margin:0;font-family:var(--cond);font-weight:600;font-size:1.3rem;text-wrap:balance}
.setting{font-size:.85rem;color:var(--ink-2);margin-top:2px}
.proto{font-family:var(--mono);font-size:.82rem;background:var(--sunk);border-radius:6px;padding:10px 12px;display:grid;gap:4px}
.proto .k{color:var(--ink-3)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1 1 260px;justify-content:flex-end}
.meter{display:flex;align-items:center;gap:10px;min-width:200px;flex:1 1 200px}
.bar{flex:1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--t);width:0;transition:width .2s}
.meter span{font-family:var(--mono);font-size:.8rem;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink-2);font:500 .8rem var(--sans);padding:6px 10px;border-radius:6px;cursor:pointer}
.btn:hover{color:var(--ink);border-color:var(--ink-3)}

.cols{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:860px){.cols{grid-template-columns:1fr 1fr}}
section.blk{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
section.blk.wide{grid-column:1/-1}
.blk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:2px}
.blk-h h4{margin:0;font-family:var(--cond);font-weight:600;font-size:.95rem;text-transform:uppercase;letter-spacing:.06em}
.blk-h .hint{font-size:.76rem;color:var(--ink-3);margin-left:auto}
.blk-h .count{font-family:var(--mono);font-size:.78rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.blk.inc h4{color:var(--t)} .blk.exc h4{color:var(--exc)} .blk.indv h4{color:var(--ind)}
.sub{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:8px 0 0;font-family:var(--cond)}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.items li{border-bottom:1px dashed var(--line)}
ul.items li:last-child{border-bottom:0}
label.it{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:8px 0;cursor:pointer;align-items:start;position:relative}
label.it input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:18px;height:18px;border:1.5px solid var(--ink-3);border-radius:4px;margin-top:2px;display:grid;place-items:center;background:var(--surface)}
.box svg{width:12px;height:12px;opacity:0}
.box svg path{stroke:var(--on-t)}
label.it input:checked+.box{background:var(--t);border-color:var(--t)}
.exc label.it input:checked+.box{background:var(--exc);border-color:var(--exc)}
.exc .box svg path{stroke:var(--surface)}
label.it input:checked+.box svg{opacity:1}
label.it input:checked ~ .tx{color:var(--ink-3)}
.tx{font-size:.92rem}
.tx em{font-style:normal;color:var(--ink-3);font-size:.82rem}
.tag{display:inline-block;font:500 .68rem/1 var(--sans);padding:3px 6px;border-radius:4px;margin-left:6px;vertical-align:1px;white-space:nowrap;background:var(--t-s);color:var(--t)}
.orgroup{border-left:2px solid var(--t-s);padding-left:10px;margin:4px 0}
.plain li{padding:6px 0;font-size:.92rem;display:grid;grid-template-columns:16px 1fr}
.plain li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ind);margin-top:.55em}
.plain.sug li::before{background:var(--ink-3)}
.notes{display:flex;flex-direction:column}
.note{font-size:.9rem;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line)}
.note:last-child{border-bottom:0}
.lvl{font:500 .68rem/1 var(--sans);padding:4px 6px;border-radius:4px;white-space:nowrap}
.lvl.c{background:var(--ok-soft);color:var(--ok)} .lvl.i{background:var(--ind-soft);color:var(--ind)} .lvl.e{background:var(--exc-soft);color:var(--exc)}
details.fu{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
details.fu summary{cursor:pointer;font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.9rem;color:var(--t)}
details.fu ul{margin:10px 0 2px;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
footer{font-size:.78rem;color:var(--ink-3)}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>

</head>
<body>
<div class="app" id="app" data-tumor="mama">
  <header class="top">
    <h1>Checklist de autorización FNR</h1>
    <p>Requisitos de cobertura de tratamiento sistémico por normativa del Fondo Nacional de Recursos</p>
  </header>
  <nav class="tumors" id="tumors" aria-label="Tumor"></nav>
  <div class="band" id="band"></div>
  <nav class="picker" id="picker" aria-label="Indicación"></nav>
  <div class="ihead">
    <div class="ihead-top">
      <div><h3 id="i-title"></h3><div class="setting" id="i-setting"></div></div>
      <div class="actions">
        <div class="meter" aria-live="polite"><div class="bar"><i id="bar"></i></div><span id="meter-txt"></span></div>
        <button class="btn" id="reset" type="button">Desmarcar</button>
      </div>
    </div>
    <div class="proto" id="i-proto"></div>
  </div>
  <div class="cols" id="cols"></div>
  <details class="fu" id="fu"><summary>Después de autorizado: seguimiento</summary><ul id="fu-list"></ul></details>
  <footer id="foot"></footer>
</div>

<script>
(function(){
const CHECK='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.2l2.6 2.6L10 3.4" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const TRAMITE=[
  'Formulario de Solicitud de Tratamiento (online) completado por el oncólogo tratante',
  'Resumen de historia clínica completo y legible, con evolución y motivos de la indicación (indispensable)',
  'Valoración integral documentada: edad, comorbilidades, calidad de vida y pronóstico → expectativa de vida razonable',
  'Fotocopia de la cédula de identidad del paciente'
];
/* ---------- textos comunes ---------- */
const X={
  qol:'Mala calidad de vida y/o pobre expectativa de vida por comorbilidades',
  card:'HTA no controlada, cardiopatía que contraindique, o FEVI < 50 %',

  psy2:'Patología psiquiátrica o abuso de sustancias que interfiera con controles y adherencia',
  hep:'Hepatopatía con bilirrubina aumentada y transaminasas > 1,5 × LSN',
  cit:'Citopenias severas previas al inicio',
  preg:'Embarazo o lactancia',
  snc:'Metástasis del SNC no controladas con tratamientos previos',
  imm:'Inmunodeficiencia o enfermedad autoinmune activa severa',
  vir:'Infección activa por VHB, VHC y/o VIH',
  neo:'Otra neoplasia maligna no controlada',
  cyp:'Inductores potentes de CYP3A4 en las 3 semanas previas',
  qt:'Prolongación del intervalo QT en el ECG',
  org:'Afección renal, hepática o hematológica significativa',
  epid:'Enfermedad pulmonar intersticial difusa activa o con corticoides recientes'
};
const STD=[X.qol,X.card,X.psy,X.hep,X.cit,X.preg];
const HER2='HER2 positivo: IHQ 3+ o ISH positivo (método validado)';
const RETRAT='Completó 35 ciclos de pembrolizumab sin progresión y progresa ≥ 6 meses después (retratamiento)';

/* ---------- TUMORES ---------- */
const TUMORS=[
/* ======================= MAMA ======================= */
{id:'mama',name:'Mama',sub:'8 indicaciones',src:'Normativa FNR · actualización agosto 2024',
 drugs:'Trastuzumab, pertuzumab, T-DM1, lapatinib, fulvestrant, ribociclib, pembrolizumab',
 groups:[['op','Operable'],['av','Avanzado']],
 para:[
  {t:'Anatomía patológica que confirme carcinoma mamario'},
  {t:'Receptores de estrógeno y progesterona'},
  {t:'HER2/neu en el componente invasor'},
  {t:'PD-L1 con CPS (≥ 10)',only:['m-pembro']},
  {t:'AP de enfermedad residual invasiva con resección completa (R0)',only:['m-adj-tdm1']},
  {t:'Biopsia de metástasis, con RH/HER2',stage:'av',cond:'cuando esté indicada (obligatoria si es lesión única)'},
  {t:'Rx de tórax + ecografía de abdomen, y/o TC de tórax, abdomen y pelvis'},
  {t:'ECG + ecocardiograma con FEVI que descarte cardiopatía estructural',not:['m-fulv']},
  {t:'Centellograma óseo',stage:'op',cond:'si ≥ 4 ganglios axilares + o sospecha de MTS ósea'},
  {t:'Centellograma óseo',stage:'av',cond:'si sospecha de MTS ósea'},
  {t:'Biopsia de médula ósea',cond:'si sospecha de infiltración medular (anemia normo-normo sin otra causa)'},
  {t:'TC de cráneo y/o RNM',cond:'si síntomas neurológicos'},
  {t:'Hemograma completo + funcional y enzimograma hepático completo'},
  {t:'Ionograma y creatininemia'},
  {t:'Calcemia',cond:'sólo si secundarismo óseo'},
  {t:'CA 15-3',stage:'av'},
  {t:'Serologías VIH, VHB y VHC',only:['m-pembro']}
 ],
 fu:['Solicitud de dosis del mes siguiente en formulario online, <b>Sistema María</b>, declarando complicaciones y eventos adversos que lleven a discontinuar.','Evaluación de respuesta <b>trimestral por RECIST</b>.','Suspensión: progresión lesional o intolerancia.','Al finalizar/suspender: informar dosis y fecha de la última serie y, si suspende, causa y fecha.','Hepatograma, hemograma, ECG y ecocardiograma seriados a cargo de la institución; reportar cardiotoxicidad que obligue a ajustar o suspender.'],
 inds:[
 {id:'m-neo-t',g:'op',chip:'Trastuzumab',sub:'Neoadyuvancia',title:'Trastuzumab neoadyuvante',setting:'Operable · HER2+',
  proto:[['IV','carga 8 mg/kg → 6 mg/kg c/3 sem, o carga 4 mg/kg → 2 mg/kg semanal'],['SC','600 mg dosis fija c/3 sem'],['Total','neo + adyuvancia: 18 ciclos']],
  inc:['Diagnóstico AP de carcinoma invasor de mama',HER2,'ECOG 0–1','Sin quimioterapia previa','cT ≥ 2 (≥ 2 cm) o cN ≥ 1'],
  exc:['Cáncer de mama metastásico',...STD],
  notes:[['i','La tabla no fija duración propia de la fase neoadyuvante con trastuzumab solo; el tope práctico es el total neo + adyuvancia de 18 ciclos.']]},
 {id:'m-neo-tp',g:'op',chip:'Trastuzumab + Pertuzumab',sub:'Neoadyuvancia',title:'Trastuzumab + Pertuzumab neoadyuvante',setting:'Operable · HER2+',
  proto:[['SC','combinado a dosis fijas: carga T 600 / P 1200 mg → T 600 / P 600 mg c/3 sem'],['Duración','3 a 6 ciclos']],
  inc:['Diagnóstico AP de carcinoma invasor de mama',HER2,'ECOG 0–1','Sin quimioterapia previa',{or:['N ≥ 1','cT ≥ 2 (≥ 2 cm) con cualquier N','Cáncer de mama inflamatorio']}],
  exc:['Cáncer de mama metastásico',...STD],
  notes:[['c','La tabla sólo lista la formulación SC combinada a dosis fijas (no pertuzumab IV).'],['c','Pertuzumab no tiene cobertura en adyuvancia: adyuvancia cubierta = trastuzumab o T-DM1.']]},
 {id:'m-adj-t',g:'op',chip:'Trastuzumab',sub:'Adyuvancia',title:'Trastuzumab adyuvante',setting:'Operable · HER2+',
  proto:[['IV','carga 8 mg/kg → 6 mg/kg c/3 sem'],['SC','600 mg dosis fija c/3 sem'],['Total','neo + adyuvancia: 18 ciclos']],

  notes:[['i','El plazo de < 3 meses se cuenta desde la última dosis de QT: consignar la fecha exacta en el resumen.']]},
 {id:'m-adj-tdm1',g:'op',chip:'T-DM1',sub:'Adyuvancia post-neo',title:'T-DM1 adyuvante (enfermedad residual)',setting:'Operable · HER2+ · residual invasivo post-neoadyuvancia',
  proto:[['IV','3,6 mg/kg c/3 sem'],['Total','neo + adyuvancia: 18 ciclos']],

/* ---------- estado ---------- */
const KEY='fnr-onco-v1';
let S={tumor:'mama',sel:{},checks:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&s.checks) S=Object.assign(S,s);}catch(e){}
const allInds=[];TUMORS.forEach(t=>t.inds.forEach(i=>{i.tumor=t;allInds.push(i);}));
const h=(location.hash||'').slice(1);
if(TUMORS.some(t=>t.id===h)) S.tumor=h;
const hi=allInds.find(i=>i.id===h); if(hi){S.tumor=hi.tumor.id;S.sel[hi.tumor.id]=hi.id;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const tumor=()=>TUMORS.find(t=>t.id===S.tumor);
const cur=()=>{const t=tumor();const id=S.sel[t.id];return t.inds.find(i=>i.id===id)||t.inds[0];};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function paraFor(ind){
  const t=ind.tumor,req=[],cond=[],sug=[];
  t.para.forEach((p,n)=>{
    if(p.only&&!p.only.includes(ind.id))return;
    if(p.not&&p.not.includes(ind.id))return;
    if(p.stage&&p.stage!==ind.g)return;
    const o=Object.assign({k:'p'+n},p);
    (p.sug?sug:p.cond?cond:req).push(o);
  });
  return {req,cond,sug};
}
function keys(ind){
  const k=[];
  ind.inc.forEach((x,n)=>k.push(typeof x==='object'?'inc'+n+'or':'inc'+n));
  ind.exc.forEach((x,n)=>k.push('exc'+n));
  TRAMITE.forEach((x,n)=>k.push('tr'+n));
  paraFor(ind).req.forEach(p=>k.push(p.k));
  return k;
}
function done(ind,k){
  const c=S.checks[ind.id]||{};const m=k.match(/^inc(\d+)or$/);
  if(m)return ind.inc[+m[1]].or.some((_,j)=>c['inc'+m[1]+'o'+j]);
  return !!c[k];
}
function prog(ind,pref){const ks=keys(ind).filter(k=>!pref||k.startsWith(pref));return [ks.filter(k=>done(ind,k)).length,ks.length];}
function item(ind,key,text,extra){
  const id=ind.id+'__'+key,on=!!(S.checks[ind.id]||{})[key];
  return `<li><label class="it" for="${id}"><input type="checkbox" id="${id}" data-k="${key}" ${on?'checked':''}><span class="box">${CHECK}</span><span class="tx">${text}${extra||''}</span></label></li>`;
}

function render(){
  const t=tumor(),ind=cur();
  document.getElementById('app').dataset.tumor=t.id;
  document.getElementById('tumors').innerHTML=TUMORS.map(x=>{
    const n=x.inds.filter(i=>{const[d,a]=prog(i);return d===a;}).length;
    return `<button type="button" class="tt" data-t="${x.id}" aria-pressed="${x.id===t.id}"><b>${esc(x.name)}</b><small>${x.inds.length} indicaci${x.inds.length>1?'ones':'ón'}${n?` · ${n} ✓`:''}</small></button>`;}).join('');
  document.getElementById('band').innerHTML=`<h2>${esc(t.name)}</h2><span>${esc(t.drugs)} · <b>${esc(t.src)}</b></span>`;
  document.getElementById('picker').innerHTML=t.groups.map(([g,l])=>{
    const cs=t.inds.filter(i=>i.g===g).map(i=>{const[d,a]=prog(i);
      return `<button type="button" class="chip" data-id="${i.id}" aria-pressed="${i.id===ind.id}"><span>${esc(i.chip)}${d===a?'<span class="dot" title="Completo"></span>':''}</span><small>${esc(i.sub)}</small></button>`;}).join('');
    return `<div class="grp-label">${esc(l)}</div><div class="chips">${cs}</div>`;}).join('');
  document.getElementById('i-title').textContent=ind.title;
  document.getElementById('i-setting').textContent=ind.setting;
  document.getElementById('i-proto').innerHTML=ind.proto.map(([k,v])=>`<div><span class="k">${esc(k)} ·</span> ${esc(v)}</div>`).join('');

  const inc=ind.inc.map((x,n)=>typeof x==='object'
    ?`<li><div class="orgroup"><div class="sub">${esc(x.label||'Al menos uno de')}<span class="tag">cualquiera</span></div><ul class="items">${x.or.map((o,j)=>item(ind,'inc'+n+'o'+j,esc(o))).join('')}</ul></div></li>`
    :item(ind,'inc'+n,esc(x))).join('');
  const exc=ind.exc.map((x,n)=>item(ind,'exc'+n,esc(x))).join('');
  const tr=TRAMITE.map((x,n)=>item(ind,'tr'+n,esc(x))).join('');
  const P=paraFor(ind);
  const cnt=p=>{const[d,a]=prog(ind,p);return d+'/'+a;};
  let html=`
  <section class="blk inc"><div class="blk-h"><h4>Inclusión</h4><span class="hint">marcar lo que cumple</span><span class="count">${cnt('inc')}</span></div><ul class="items">${inc}</ul></section>
  <section class="blk exc"><div class="blk-h"><h4>Exclusión</h4><span class="hint">marcar lo descartado</span><span class="count">${cnt('exc')}</span></div><ul class="items">${exc}</ul></section>
  <section class="blk"><div class="blk-h"><h4>Paraclínica a enviar</h4><span class="count">${cnt('p')}</span></div><ul class="items">${P.req.map(p=>item(ind,p.k,esc(p.t))).join('')}</ul>
   ${P.cond.length?`<div class="sub">Si corresponde</div><ul class="items">${P.cond.map(p=>item(ind,p.k,esc(p.t),`<br><em>${esc(p.cond)}</em>`)).join('')}</ul>`:''}
   ${P.sug.length?`<div class="sub">Sugeridos, no indispensables</div><ul class="items plain sug">${P.sug.map(p=>`<li><span>${esc(p.t)}</span></li>`).join('')}</ul>`:''}
  </section>
  <section class="blk"><div class="blk-h"><h4>Trámite</h4><span class="count">${cnt('tr')}</span></div><ul class="items">${tr}</ul></section>`;
  if(ind.indv)html+=`<section class="blk indv"><div class="blk-h"><h4>Se discute individualizado</h4></div><ul class="items plain">${ind.indv.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ul></section>`;
  if(ind.notes&&ind.notes.length){const L={c:'Dato confirmado',i:'Inferencia razonable',e:'Extrapolación'};
    html+=`<section class="blk ${ind.indv?'':'wide'}"><div class="blk-h"><h4>Ojo con</h4></div><div class="notes">${ind.notes.map(([l,x])=>`<div class="note"><span class="lvl ${l}">${L[l]}</span><span>${esc(x)}</span></div>`).join('')}</div></section>`;}
  document.getElementById('cols').innerHTML=html;
  const[d,a]=prog(ind);
  document.getElementById('bar').style.width=(a?d/a*100:0)+'%';
  document.getElementById('meter-txt').textContent=d+' / '+a+' obligatorios';
  document.getElementById('fu-list').innerHTML=t.fu.map(x=>`<li>${x}</li>`).join('');
  document.getElementById('foot').textContent='Las marcas se guardan sólo en este dispositivo. Ayuda de lectura: ante duda, rige el texto vigente en fnr.gub.uy. Fuente de esta sección: '+t.src+'.';
}
document.addEventListener('click',e=>{
  const tb=e.target.closest('.tt');
  if(tb){S.tumor=tb.dataset.t;save();render();try{history.replaceState(null,'','#'+S.tumor);}catch(_){}return;}
  const b=e.target.closest('.chip');
  if(b){S.sel[S.tumor]=b.dataset.id;save();render();try{history.replaceState(null,'','#'+b.dataset.id);}catch(_){}}
});
document.getElementById('cols').addEventListener('change',e=>{
  const k=e.target.dataset.k;if(!k)return;const ind=cur();
  (S.checks[ind.id]=S.checks[ind.id]||{})[k]=e.target.checked;save();
  const y=window.scrollY;render();window.scrollTo(0,y);
  const el=document.getElementById(ind.id+'__'+k);if(el)el.focus({preventScroll:true});
});
document.getElementById('reset').addEventListener('click',()=>{S.checks[cur().id]={};save();render();});
render();
})();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
